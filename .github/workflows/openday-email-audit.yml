name: OpenDay Email Audit
on:
  push:
    paths:
      - '.github/workflows/openday-email-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify URLs and front-end flows
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AKfycbx934SuTzxYNzb82Tn9_kwPfTbAQFBQv5kGoqtIBP1GAlPdnICUAG2tFSYAnKhmf1P6Ow' index.html
          grep -q 'AKfycbx2BNhnVfV2Mu0YMjHy-wcagr5-_nHui8nZqMLZXfjPD1iEsKRKSX4k6URFD1t_kmq_Jw' index.html
          grep -q 'AKfycbyW546zDa6kAI5cAaJkL-se9ngljm4c3UhlFuMxMPMmNVO-f5QsdUCqeotfJe0aFy7MBA' index.html
          grep -q 'AKfycbz8MnsiM0QnbbkMqiSFCOVMpbFQamKaSy8lm7E-LdyeuOIEbmA_BqRINa4Pt7Nq7HFt' index.html
          grep -q "regData.passSentDate = 'IN_CODA_Q1'" index.html
          grep -q "inviaEmailScript(CONFIRM_SCRIPT_URL" index.html
          grep -q "inviaEmailScript(CANCEL_SCRIPT_URL" index.html
          grep -q "url: ATTESTATO_ENTRATA_URL" index.html
          grep -q "url: ATTESTATO_USCITA_URL" index.html
          grep -q "promemoriaSentDate: 'IN_CODA_Q2'" index.html
          echo FRONTEND_FLOW_STATIC_OK
      - name: Probe all Apps Script endpoints with browser-like redirects
        shell: bash
        run: |
          set -u
          confirm='https://script.google.com/macros/s/AKfycbx934SuTzxYNzb82Tn9_kwPfTbAQFBQv5kGoqtIBP1GAlPdnICUAG2tFSYAnKhmf1P6Ow/exec'
          cancel='https://script.google.com/macros/s/AKfycbx2BNhnVfV2Mu0YMjHy-wcagr5-_nHui8nZqMLZXfjPD1iEsKRKSX4k6URFD1t_kmq_Jw/exec'
          ingresso='https://script.google.com/macros/s/AKfycbyW546zDa6kAI5cAaJkL-se9ngljm4c3UhlFuMxMPMmNVO-f5QsdUCqeotfJe0aFy7MBA/exec'
          uscita='https://script.google.com/macros/s/AKfycbz8MnsiM0QnbbkMqiSFCOVMpbFQamKaSy8lm7E-LdyeuOIEbmA_BqRINa4Pt7Nq7HFt/exec'
          probe() {
            name="$1"; url="$2"
            body="/tmp/${name}.txt"
            headers="/tmp/${name}.headers"
            code=$(curl -sS -L --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' -H 'Content-Type: text/plain;charset=utf-8' --data '{"email":"","nome":"Audit","cognome":"OpenDay","codice_prenotazione":"AUDIT-NO-MAIL","data":"07/09/2026","attivita":"Audit tecnico"}' "$url" || true)
            echo "${name}_HTTP=${code}"
            echo "${name}_REDIRECTS=$(grep -ci '^location:' "$headers" || true)"
            echo "${name}_BODY=$(head -c 700 "$body" | tr '\n' ' ' || true)"
          }
          probe CONFIRM "$confirm"
          probe CANCEL "$cancel"
          probe INGRESSO "$ingresso"
          probe USCITA "$uscita"
      - name: Verify published page is reachable
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 30 -o /tmp/live.html -w '%{http_code}' 'https://giuseppeborzumati-cmyk.github.io/Open_Day/' || true)
          echo "LIVE_HTTP=$code"
          test "$code" = "200"
          grep -q 'Open Day - ITSCG Primo Levi Seregno' /tmp/live.html
          grep -q 'AKfycbx934SuTzxYNzb82Tn9_kwPfTbAQFBQv5kGoqtIBP1GAlPdnICUAG2tFSYAnKhmf1P6Ow' /tmp/live.html
          echo LIVE_DEPLOYMENT_OK
