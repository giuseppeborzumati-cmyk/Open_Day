name: Normalizza Liceo Open Day

on:
  push:
    paths:
      - '.github/workflows/normalize-liceo-label.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica correzione
        run: python tools/normalize_liceo_label.py
      - name: Verifica correzione
        run: |
          grep -Fq "LS - Liceo Scientifico opzione Scienze Applicate e Liceo Scienze Applicate - Curvatura Economica" index.html
          ! grep -Fq "LS - Liceo Scientifico opzione Scienze Applicate & Liceo Scienze Applicate - Curvatura Economica" index.html
          ! grep -Fq "Curvatura Economica/h4>" index.html
      - name: Pubblica e pulisce
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html
          git rm tools/normalize_liceo_label.py .github/workflows/normalize-liceo-label.yml
          git commit -m "Uniforma denominazione Liceo Open Day"
          git push
