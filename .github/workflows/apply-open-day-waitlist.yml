name: Integra lista attesa Open Day

on:
  push:
    paths:
      - 'tools/apply_open_day_waitlist.py'
      - '.github/workflows/apply-open-day-waitlist.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Applica patch lista attesa
        run: python tools/apply_open_day_waitlist.py

      - name: Verifica statica e sintassi
        run: |
          grep -q "OPEN_DAY_WAITLIST_V1" index.html
          grep -q "const WAITLIST_TYPE = 'lista_attesa'" index.html
          grep -q "window.startWaitlistProcess" index.html
          grep -q "tabWaitlist" index.html
          grep -q "waitlistPromotionStatus: 'Ammesso da scorrimento'" index.html
          grep -q "reg.type !== WAITLIST_TYPE" index.html
          grep -q "Curvatura Economia" index.html
          python - <<'PY'
          import re
          h=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          assert scripts, 'Script module non trovato'
          open('/tmp/open-day-module.mjs','w',encoding='utf-8').write(scripts[-1])
          PY
          node --check /tmp/open-day-module.mjs
          echo OPEN_DAY_WAITLIST_STATIC_CHECK_OK

      - name: Commit finale e pulizia
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html
          git rm tools/apply_open_day_waitlist.py .github/workflows/apply-open-day-waitlist.yml
          git commit -m "Integra lista attesa FIFO Open Day"
          git push
