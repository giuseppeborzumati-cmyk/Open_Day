name: Fix Open Day waitlist capacity v2
on:
  push:
    paths:
      - 'tools/fix_openday_waitlist_capacity_v2.py'
      - '.github/workflows/fix-openday-waitlist-capacity-v2.yml'
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply waitlist capacity patch
        run: python tools/fix_openday_waitlist_capacity_v2.py
      - name: Check patched module syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script type="module">([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/openday-app.mjs').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/openday-app.mjs
      - name: Verify anti-overbooking rules
        run: |
          grep -q 'OPEN_DAY_WAITLIST_V2' index.html
          grep -q 'automatico_capienza_compatibile' index.html
          grep -q 'occupied + needed > maxSeats' index.html
          grep -q 'GROUP_EXCEEDS_CAPACITY' index.html
          grep -q 'CAPACITY_BELOW_OCCUPIED' index.html
          grep -q 'Capienza turno:' index.html
          echo OPEN_DAY_WAITLIST_V2_VERIFIED
      - name: Commit final files and cleanup
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html
          git rm tools/fix_openday_waitlist_capacity_v2.py .github/workflows/fix-openday-waitlist-capacity-v2.yml
          git commit -m "Corregge lista attesa Open Day per capienza reale"
          git push
